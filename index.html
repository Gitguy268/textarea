<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="description" content="A minimalist text editor that lives in your browser. Open text and PDF files, export to any text format or a QR code, keep every note in your own document library, mirror them into a folder you pick, and lock a note in an AES-256 encrypted archive. Nothing is uploaded.">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<!-- The LLM-readable overview of the site, per llmstxt.org. `describedby` is
     the relation that proposal recommends, so an agent reading this page can
     find the file that describes it. -->
<link rel="describedby" href="llms.txt">
<title>Textarea</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    color-scheme: light dark;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;

    background-color: #fff;
    --elevated: #fff;
    --link: #0066cc;
    --text: #161616;
    --outline: #007aff;
    --overlay: rgba(0, 0, 0, 0.04);
    --danger: #d1242f;
    --busy: #6e7781;

    /* The reader's own note appearance, from the settings panel. These are
       the defaults an untouched panel leaves in place; the panel writes
       them as inline overrides on this element and takes them back off
       again when the choice is cleared. */
    --note-font: system-ui;
    --note-size: 18px;
    --note-leading: 1.5;

    @media (prefers-color-scheme: dark) {
      background-color: #000;
      --elevated: #121212;
      --link: #58a6ff;
      --text: #fff;
      --overlay: rgba(255, 255, 255, 0.06);
      --danger: #ff7b72;
      --busy: #8b949e;
    }

    /* An explicit choice from the menu. These come after the media query and
       carry an attribute, so they win over whatever the system says. The & is
       needed: this file nests, and a bare html selector inside the rule above
       would mean a descendant of html. */
    &[data-theme='light'] {
      background-color: #fff;
      --elevated: #fff;
      --link: #0066cc;
      --text: #161616;
      --outline: #007aff;
      --overlay: rgba(0, 0, 0, 0.04);
      --danger: #d1242f;
      --busy: #6e7781;
    }

    &[data-theme='dark'] {
      background-color: #000;
      --elevated: #121212;
      --link: #58a6ff;
      --text: #fff;
      --outline: #007aff;
      --overlay: rgba(255, 255, 255, 0.06);
      --danger: #ff7b72;
      --busy: #8b949e;
    }
  }

  body {
    color: var(--text);
  }

  a {
    color: var(--link);
    text-decoration: underline;
    text-underline-offset: 4px;
    text-decoration-thickness: 1px;
  }

  main {
    display: contents;
  }

  /* Text for a screen reader only: in the accessible name, off the screen. */
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }

  article {
    outline: none;
    padding: 18px max(18px, calc(50vw - 400px));
    width: 100%;
    min-height: 100dvh;
    font-family: var(--note-font);
    font-size: var(--note-size);
    line-height: var(--note-leading);
    tab-size: 4;
    white-space: pre-wrap;
    text-wrap-style: stable;
    overflow-wrap: break-word;
  }

  .md-h1,
  .md-h2,
  .md-h3,
  .md-h4,
  .md-h5,
  .md-h6 {
    font-weight: 700;
  }

  .md-h1 {
    font-size: 2em;
  }

  .md-h2 {
    font-size: 1.5em;
  }

  .md-h3 {
    font-size: 1.25em;
  }

  .md-h4 {
    font-size: 1.1em;
  }

  .md-h5 {
    font-size: 1em;
  }

  .md-h6 {
    font-size: 0.9em;
  }

  .md-code {
    font-family: monospace;
  }

  .md-codeblock {
    font-family: monospace;
  }

  .md-bold {
    font-weight: bold;
  }

  .md-strike {
    text-decoration: line-through;
  }

  .md-italic {
    font-style: italic;
  }

  .md-url,
  .md-file,
  .md-wiki {
    cursor: pointer;
  }

  /* Lists. The marker the reader typed stays in the text and is hidden, and the
     bullet is drawn instead, because article.textContent has to keep returning
     the note exactly as typed. A numbered item keeps its own marker: the number
     is already there and there is nothing to renumber. */
  .md-marker {
    display: none;
  }

  .md-li::before {
    content: '\2022';
    color: var(--busy);
    margin-right: 0.4em;
  }

  .md-li-2 {
    margin-left: 1.5em;
  }

  .md-li-3 {
    margin-left: 3em;
  }

  .md-li-4 {
    margin-left: 4.5em;
  }

  .md-li-5 {
    margin-left: 6em;
  }

  .md-li-6 {
    margin-left: 7.5em;
  }

  /* Tasks. The bracket the reader typed stays in the text and is hidden,
     and the checkbox is drawn instead - the same bargain the marker makes
     with its bullet. The span is zero-sized so only the drawn box shows,
     and the box is what the click lands on: it flips the one character
     the task is made of. inline-block, so the drawn box is the span's
     own box - a plain inline span with zero-sized text would have no box
     at all to be clicked in. */
  .md-task {
    cursor: pointer;
    display: inline-block;
    font-size: 0;
    vertical-align: middle;
  }

  .md-task::before {
    content: '';
    display: inline-block;
    width: 0.95em;
    height: 0.95em;
    font-size: 14px;
    border: 1.5px solid var(--busy);
    border-radius: 3px;
    text-align: center;
    line-height: 1;
    vertical-align: -0.15em;
  }

  .md-task:hover::before {
    border-color: var(--text);
  }

  .md-task-done::before {
    content: '\2713';
    color: var(--busy);
    font-weight: 700;
  }

  /* A line whose task is ticked dims: the box carries the state, and the
     line says the task is behind the reader. */
  .md-li:has(.md-task-done) {
    opacity: 0.65;
  }

  #button {
    -webkit-tap-highlight-color: transparent;
    background-color: #0569fa;
    border-radius: 50%;
    border: none;
    bottom: 15px;
    box-shadow: 0 3px 5px -1px rgba(0, 0, 0, 0.2), 0 6px 10px 0 rgba(0, 0, 0, 0.14), 0 1px 18px 0 rgba(0, 0, 0, .12);
    color: #fff;
    cursor: pointer;
    display: grid;
    font-weight: 600;
    width: 46px;
    height: 46px;
    outline: none;
    overflow: hidden;
    padding: 0;
    place-items: center;
    position: fixed;
    right: 15px;
    text-decoration: none;
    touch-action: manipulation;
    transition: background-color .3s ease-out;
    user-select: none;
    z-index: 1;
  }

  @media (hover) {
    #button:hover {
      color: #fff;
      background-color: #3c86f3;
      box-shadow: 0 5px 5px -3px rgba(0, 0, 0, 0.2), 0 8px 10px 1px rgba(0, 0, 0, 0.14), 0 3px 14px 2px rgba(0, 0, 0, .12);
    }
  }

  #button:focus-visible {
    outline: 2px solid var(--outline);
    outline-offset: 2px;
  }

  span.ripple {
    position: absolute;
    border-radius: 50%;
    transform: scale(0);
    animation: ripple 600ms linear;
    background-color: rgba(255, 255, 255, 0.7);
  }

  @keyframes ripple {
    to {
      transform: scale(4);
      opacity: 0;
    }
  }

  #menu {
    visibility: hidden;
    transform: scale(0.9) translateY(20px);
    /* visibility is transitioned with no duration, so it flips the moment the
       menu opens and 100ms after it closes. Folding it into `all` kept it
       hidden for the length of the animation, which made every item refuse
       focus while the menu was open and visible. */
    transition:
      opacity 100ms cubic-bezier(0.4, 0, 0.2, 1),
      transform 100ms cubic-bezier(0.4, 0, 0.2, 1),
      visibility 0s linear 100ms;
    opacity: 0;
    display: flex;
    flex-direction: column;
    /* Wide enough for "Two column PDFs: on" on one line, which it stopped being
       at 216px once the menu grew a row. */
    width: 244px;
    max-height: min(70dvh, 470px);
    overflow-y: auto;
    overscroll-behavior: contain;
    position: fixed;
    right: 16px;
    bottom: 77px;
    box-shadow: 0 19px 38px rgba(0, 0, 0, 0.10), 0 15px 12px rgba(0, 0, 0, 0.05);
    background: var(--elevated);
    backdrop-filter: blur(10px);
    border-radius: 10px;
    z-index: 2;
  }

  #menu.visible {
    opacity: 1;
    transform: scale(1) translateY(0);
    visibility: visible;
    transition:
      opacity 100ms cubic-bezier(0.4, 0, 0.2, 1),
      transform 100ms cubic-bezier(0.4, 0, 0.2, 1),
      visibility 0s;
  }

  #menu .item {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    text-decoration: none;
    text-align: left;
    padding: 10px 14px;
    /* Rows keep their height and the menu scrolls. Left to shrink, twenty
       rows on a short window were squeezed to 24px each with the last one
       cut off - too small a target, and nothing said there was more. */
    flex-shrink: 0;
    overflow: hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    outline: none;
    border: none;
    touch-action: manipulation;
    font: 16px / 1.5 system-ui;
    color: var(--text);
  }

  #menu .item:hover {
    background-color: var(--overlay);
  }

  #menu .item:focus-within {
    outline: 2px solid var(--outline);
  }

  /* A set display on the item outranks the user agent's [hidden] rule, so an
     entry hidden from script would still be drawn. Say so explicitly. */
  #menu .item[hidden] {
    display: none;
  }

  /* Menu entries that run script rather than navigate need the button reset. */
  button.item {
    background: none;
    width: 100%;
    font-family: inherit;
  }

  button.item[aria-checked='true']::after {
    content: '✓';
    margin-left: auto;
    color: var(--link);
    font-weight: 700;
  }

  .item-separator {
    border: none;
    border-top: 1px solid var(--overlay);
    margin: 4px 10px;
  }

  #menu .item:first-child {
    border-top-left-radius: 10px;
    border-top-right-radius: 10px;
  }

  #menu .item:last-child {
    border-bottom-left-radius: 10px;
    border-bottom-right-radius: 10px;
  }

  #notification {
    visibility: hidden;
    transform: translateY(-30px);
    transition: all 200ms cubic-bezier(0.4, 0, 0.2, 1) 0ms;
    opacity: 0;

    display: flex;
    flex-direction: column;

    position: fixed;
    right: 17px;
    top: 17px;

    background: #5ad227;
    color: #fff;
    border-radius: 30px;
    font: 18px / 1 system-ui;
    font-weight: 600;
    z-index: 2;
    padding: 10px 20px;

    max-width: min(90vw, 460px);
    line-height: 1.4;
    white-space: pre-line;
  }

  #notification.visible {
    opacity: 1;
    transform: translateY(0);
    visibility: visible;
  }

  #notification.error {
    background: var(--danger);
  }

  #notification.busy {
    background: var(--busy);
  }

  /* The file input is a fallback for browsers without the file picker API; the
     menu item and drag and drop are the primary routes. */
  #file-input {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
  }

  #drop-overlay {
    visibility: hidden;
    opacity: 0;
    transition: opacity 120ms ease-out;

    position: fixed;
    inset: 12px;
    z-index: 3;
    pointer-events: none;

    display: grid;
    place-items: center;
    border: 3px dashed var(--outline);
    border-radius: 18px;
    background: var(--elevated);
    opacity: 0.92;
  }

  #drop-overlay.visible {
    visibility: visible;
    opacity: 1;
  }

  #drop-overlay span {
    font: 600 20px / 1.4 system-ui;
    color: var(--text);
    padding: 24px;
    text-align: center;
  }

  /* ------------------------------------------------------ the glass panels */

  /* An opaque panel has nothing behind it for the effect to bend, so with the
     Glass row on the menu, the dialogs and the statistics panel go translucent
     and pick up a blur — which the vendored liquid-glass module then replaces
     with the real refraction, its inline backdrop-filter winning over this
     rule. When the row is off, or a reader has asked for reduced transparency,
     the .glass class leaves the root and every rule here stops applying: the
     panels are exactly the opaque boxes they were before this existed. */
  html.glass #menu,
  html.glass .dialog,
  html.glass #stats-panel,
  html.glass #backlinks-panel,
  html.glass #tasks-panel,
  html.glass #writing-panel {
    background: color-mix(in srgb, var(--elevated) 75%, transparent);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  /* ---------------------------------------------------------------- dialogs */

  .dialog {
    padding: 0;
    border: none;
    border-radius: 14px;
    background: var(--elevated);
    color: var(--text);
    box-shadow: 0 19px 38px rgba(0, 0, 0, 0.2), 0 15px 12px rgba(0, 0, 0, 0.1);
    max-width: min(92vw, 420px);
    width: 100%;
  }

  .dialog::backdrop {
    background: rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(2px);
  }

  .dialog-form {
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 20px;
    margin: 0;
  }

  .dialog-title {
    font: 700 20px / 1.3 system-ui;
  }

  .dialog-description,
  .dialog-note,
  .dialog-hint {
    font: 15px / 1.45 system-ui;
    opacity: 0.7;
  }

  .dialog-note {
    opacity: 0.6;
    font-size: 13px;
  }

  .dialog-hint {
    font-size: 13px;
    opacity: 0.64;
  }

  .dialog-error {
    font: 15px / 1.4 system-ui;
    color: var(--danger);
    background: color-mix(in srgb, var(--danger) 10%, transparent);
    border-radius: 8px;
    padding: 8px 10px;
  }

  .dialog-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  /* A conditional field is hidden by removing it from the layout entirely. The
     group sets `display: flex`, which outranks the user agent's [hidden] rule,
     so a field answered "no" to `when` would otherwise stay on screen. */
  .dialog-field[hidden] {
    display: none;
  }

  .dialog-label {
    font: 600 14px / 1.3 system-ui;
    opacity: 0.8;
  }

  .dialog input[type='text'],
  .dialog input[type='search'],
  .dialog input[type='password'] {
    font: 16px / 1.4 system-ui;
    color: var(--text);
    background: transparent;
    border: 1px solid color-mix(in srgb, var(--text) 25%, transparent);
    border-radius: 8px;
    padding: 10px 12px;
    width: 100%;
    min-width: 0;
  }

  .dialog input[type='search']::placeholder {
    color: var(--text);
    opacity: 0.64;
  }

  .dialog input:disabled {
    opacity: 0.5;
  }

  .dialog input:focus-visible {
    outline: 2px solid var(--outline);
    outline-offset: -1px;
    border-color: transparent;
  }

  .dialog-reveal {
    align-self: flex-end;
    font: 600 13px / 1 system-ui;
    color: var(--link);
    background: none;
    border: none;
    padding: 4px 2px;
    cursor: pointer;
  }

  .dialog-choices {
    display: flex;
    flex-direction: column;
    gap: 2px;
    max-height: 240px;
    overflow-y: auto;
  }

  .dialog-choices label,
  .dialog-check {
    display: flex;
    align-items: center;
    gap: 10px;
    font: 16px / 1.4 system-ui;
    padding: 6px 8px;
    border-radius: 8px;
    cursor: pointer;
  }

  .dialog-choices label:hover,
  .dialog-check:hover {
    background: var(--overlay);
  }

  .dialog input[type='radio'],
  .dialog input[type='checkbox'] {
    width: 18px;
    height: 18px;
    accent-color: var(--outline);
    flex: none;
    margin: 0;
  }

  /* An icon in a choice row is decoration next to a label that already names it,
     so it is held back rather than competing with the text. */
  .dialog-choices label svg,
  .dialog-check svg {
    flex: none;
    opacity: 0.7;
  }

  .dialog-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 2px;
  }

  .dialog-button {
    font: 600 15px / 1 system-ui;
    color: var(--text);
    background: var(--overlay);
    border: none;
    border-radius: 999px;
    padding: 10px 18px;
    cursor: pointer;
  }

  .dialog-button-primary {
    background: #0569fa;
    color: #fff;
  }

  .dialog-button-danger {
    background: var(--danger);
    color: #fff;
  }

  .dialog-button:focus-visible {
    outline: 2px solid var(--outline);
    outline-offset: 2px;
  }

  /* A disabled action still has to read as unavailable. Without this a
     button that cannot be pressed looks like the one to press. */
  .dialog-button:disabled {
    opacity: 0.45;
    cursor: default;
  }

  /* ------------------------------------------------------- the export panels */

  /* The QR panel is narrower than a form dialog because the only thing in it is
     a square and three buttons. It still has to be wide enough for the three
     buttons to sit on one line each, so it is not much narrower. */
  .dialog-qr {
    max-width: min(94vw, 400px);
  }

  /* Three buttons, one of them two words long. */
  .dialog-encryption {
    max-width: min(94vw, 470px);
  }

  /* Two radio lists in one dialog. Nine formats are taller than a phone, so one
     list has to scroll, and it must not be the whole form: scrolling the form
     puts Cancel and Save below the fold, which is where a primary action has no
     business being. The dialog is a column, the format list takes the slack and
     scrolls on its own, and the buttons stay where they are. */
  .dialog-scroll {
    max-height: min(84dvh, 640px);
    display: flex;
    flex-direction: column;
  }

  .dialog-scroll .dialog-form {
    flex: 1;
    min-height: 0;
  }

  .dialog-scroll .dialog-field-grow {
    flex: 1;
    min-height: 0;
  }

  .dialog-scroll .dialog-field-grow .dialog-choices {
    max-height: none;
    overflow-y: auto;
  }

  .dialog-scroll .dialog-actions {
    flex: none;
  }

  /* The settings panel carries two sections and a row of controls, so it
     scrolls its own box rather than the page: taller than a phone, but the
     Close button stays reachable at the end of the form. */
  .dialog-settings {
    max-height: min(84dvh, 640px);
    overflow-y: auto;
  }

  .settings-heading {
    margin: 0;
    font: 600 15px / 1.4 system-ui;
    opacity: 0.7;
  }

  .settings-features,
  .settings-appearance {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  /* A feature's behaviour hangs off its switch, ruled off to the side so
     the indent reads as "under this" rather than as a new section. The
     [hidden] half is not optional: an author display on the element beats
     the UA's display:none for the attribute, so the box would stay on
     screen behind the switch it belongs to. */
  .feature-options {
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin-left: 9px;
    padding-left: 17px;
    border-left: 2px solid var(--overlay);
  }

  .feature-options[hidden] {
    display: none;
  }

  .settings-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font: 15px / 1.4 system-ui;
    padding: 2px 0;
  }

  .settings-row > label {
    cursor: pointer;
  }

  .settings-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  .settings-controls input[type='color'] {
    width: 44px;
    height: 26px;
    padding: 2px;
    border: 1px solid var(--busy);
    border-radius: 6px;
    background: none;
    cursor: pointer;
  }

  .settings-controls select {
    font: inherit;
    color: inherit;
    background: none;
    border: 1px solid var(--busy);
    border-radius: 6px;
    padding: 3px 6px;
    max-width: 40vw;
  }

  /* A sentence, not a value: wider than a select but still bounded, so a
     long instruction wraps the row instead of pushing the label away. */
  .settings-controls input[type='text'] {
    font: inherit;
    color: inherit;
    background: none;
    border: 1px solid var(--busy);
    border-radius: 6px;
    padding: 3px 6px;
    width: min(46vw, 260px);
    min-width: 0;
  }

  .settings-controls input[type='range'] {
    width: min(40vw, 180px);
    accent-color: var(--outline);
    margin: 0;
  }

  .settings-value {
    min-width: 5ch;
    text-align: right;
    font-variant-numeric: tabular-nums;
    opacity: 0.8;
  }

  /* The custom-fonts shelf: a file input dressed like the other controls,
     a link field that gives up the width the sentence fields take because
     the Import button shares its row, and the buttons themselves small
     enough to sit at the end of a row without turning it into a dialog of
     their own. */
  .settings-controls input[type='file'] {
    font: inherit;
    color: inherit;
    max-width: min(52vw, 280px);
  }

  .settings-controls input[type='file']::file-selector-button {
    font: inherit;
    color: inherit;
    background: var(--overlay);
    border: none;
    border-radius: 6px;
    padding: 4px 10px;
    margin-right: 8px;
    cursor: pointer;
  }

  .settings-controls input.settings-font-url {
    width: min(38vw, 200px);
  }

  .settings-font-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .settings-font-action {
    font: 500 13px / 1 system-ui;
    padding: 5px 12px;
  }

  /* The white card behind the symbol is not decoration: a scanner needs a light
     quiet zone, and on the dark theme the page background would invert the whole
     code. The border is only there to show where the symbol ends. */
  .qr-figure {
    display: grid;
    place-items: center;
    padding: 10px;
    background: #fff;
    border: 1px solid var(--overlay);
    border-radius: 10px;
    min-height: 120px;
  }

  .qr-figure svg {
    display: block;
    width: min(240px, 56vw);
    height: auto;
  }

  /* A note too long for a symbol leaves the figure empty. The dialog says why in

  /* ------------------------------------------------------ the document list */

  /* A board of sticky notes rather than a list of rows. The panel's job is to

  .dialog-library {

    align-items: stretch;
    padding: 7px;

    border-radius: 16px;

     grid is easy to read as "selected", which it is not. */

    box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--outline) 50%, transparent);

    text-align: center;
    background: #fbe28c;
    border: none;
    border-radius: 10px;

       lines of each: both are clamped, and the full note is one click away. */
